<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter for Hannah</title>
    <link rel="icon" type="me.jpg" href="me.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENVELOPE PAGE -->
   <div id="envelopePage">

     <img src="kuromi picture.jpg" class="bg-kuromi">

    <div class="floating-hearts"></div>

    <img src="kuromi envelope.jpg" id="openLetter" class="kuromi-envelope-img" alt="kuromi envelope">

    <h1 class="pixel-title">
        ♡ Letter for Hannah!! ♡
    </h1>

</div>

    </div>

    <!-- MAIN PAGE -->
    <div class="window" id="mainPage" style="display:none;">

            <div class="title-bar">
    <span>
        <img src="kuromi icon.png" class="kuromi-icon">
        HANNAH
    </span>

    <div class="hearts">
        ❤ ❤ ❤
    </div>
</div>

        <div class="content">

            <h2>Do you want to read this letter?</h2>

            <img src="Hannah's Picture.jpg" alt="Hannah" class="Hannah">

            <div class="buttons">
                <button id="yesBtn">YES</button>
                <button id="noBtn">NO</button>
            </div>

            <p id="warning"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
