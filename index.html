<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENVELOPE PAGE -->
    <div id="envelopePage">

        <div class="envelope">

            <div class="heart" id="openLetter">
                ❤️
            </div>

            <div class="letter-text">
                Click the heart
            </div>

        </div>

    </div>

    <!-- MAIN PAGE -->
    <div class="window" id="mainPage" style="display:none;">

        <div class="title-bar">
            <span>HANNAH</span>

            <div class="hearts">
                ❤ ❤ ❤
            </div>
        </div>

        <div class="content">

            <h2>Do you want to read this letter?</h2>

            <img src="Hannah's Picture.jpg" alt="Hannah" class="Hannah">

            <div class="buttons">
                <button id="yesBtn">YES</button>
                <button id="noBtn">NO</button>
            </div>

            <p id="warning"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
